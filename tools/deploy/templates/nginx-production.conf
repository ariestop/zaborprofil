server {
    listen 80;
    server_name zaborprofil.ru www.zaborprofil.ru;

    return 301 https://zaborprofil.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.zaborprofil.ru;

    ssl_certificate /etc/letsencrypt/live/zaborprofil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaborprofil.ru/privkey.pem;

    return 301 https://zaborprofil.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zaborprofil.ru;

    root /var/www/zaborprofil/current/public_html;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/zaborprofil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaborprofil.ru/privkey.pem;

    client_max_body_size 64m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /health {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    access_log /var/log/nginx/zaborprofil.access.log;
    error_log /var/log/nginx/zaborprofil.error.log warn;
}
