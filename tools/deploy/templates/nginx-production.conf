server {
    listen 80;
    server_name zaborprofil.ru www.zaborprofil.ru;

    return 301 https://zaborprofil.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.zaborprofil.ru;

    ssl_certificate /etc/letsencrypt/live/zaborprofil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaborprofil.ru/privkey.pem;

    return 301 https://zaborprofil.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zaborprofil.ru;

    root /var/www/zaborprofil/current/public_html;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/zaborprofil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaborprofil.ru/privkey.pem;

    # Modern SSL settings (configure stapling/cipher list in nginx.conf if not already global).
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;

    # Security headers. Adjust the CSP `script-src` and `style-src` if you
    # later add inline scripts/styles or third-party hosts. Vite-emitted
    # bundles are served from the same origin under /build/.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Compression for textual responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    client_max_body_size 64m;

    # Long-cache hashed Vite output (manifest-driven, content-hashed file names).
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /health {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    access_log /var/log/nginx/zaborprofil.access.log;
    error_log /var/log/nginx/zaborprofil.error.log warn;
}
