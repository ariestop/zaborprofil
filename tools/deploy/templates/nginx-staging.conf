server {
    listen 80;
    server_name staging.zaborprofil.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.zaborprofil.ru;

    root /var/www/zaborprofil/current/public_html;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/staging.zaborprofil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.zaborprofil.ru/privkey.pem;

    # Block search engines from indexing the staging environment.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Hard-disallow staging from search engines via robots.txt regardless of
    # what the application would generate. Staging must never be indexed.
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Restrict staging behind Basic Auth. The .htpasswd file must be created
    # on the VPS with htpasswd before deploy:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-zaborprofil-staging zaborprofil
    # If you want IP allowlisting instead, replace the auth_basic block with
    # `allow <ip>; deny all;` directives.
    auth_basic "Staging — restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-zaborprofil-staging;

    client_max_body_size 64m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # The deploy health-check needs to bypass Basic Auth so the post-deploy
    # script can verify the release without supplying credentials.
    location = /health {
        auth_basic off;
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    access_log /var/log/nginx/zaborprofil-staging.access.log;
    error_log /var/log/nginx/zaborprofil-staging.error.log warn;
}
