server {
    listen 80;
    server_name staging.zaborprofil.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.zaborprofil.ru;

    root /var/www/zaborprofil/current/public_html;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/staging.zaborprofil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.zaborprofil.ru/privkey.pem;

    # Restrict staging with either basic auth or allow/deny rules before going public.
    # auth_basic "Staging";
    # auth_basic_user_file /etc/nginx/.htpasswd-zaborprofil-staging;

    client_max_body_size 64m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/zaborprofil-staging.access.log;
    error_log /var/log/nginx/zaborprofil-staging.error.log warn;
}
