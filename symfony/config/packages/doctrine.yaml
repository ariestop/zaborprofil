doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '8.0'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Entity'
                prefix: 'App\Catalog\Infrastructure\Persistence\Entity'
            Pricing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Pricing/Infrastructure/Persistence/Entity'
                prefix: 'App\Pricing\Infrastructure\Persistence\Entity'
            Configurator:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Configurator/Infrastructure/Persistence/Entity'
                prefix: 'App\Configurator\Infrastructure\Persistence\Entity'
            Estimation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Estimation/Infrastructure/Persistence\Entity'
                prefix: 'App\Estimation\Infrastructure\Persistence\Entity'
            Orders:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Orders/Infrastructure/Persistence\Entity'
                prefix: 'App\Orders\Infrastructure\Persistence\Entity'
            Documents:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Documents/Infrastructure/Persistence\Entity'
                prefix: 'App\Documents\Infrastructure\Persistence\Entity'
            Leads:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Leads/Infrastructure/Persistence\Entity'
                prefix: 'App\Leads\Infrastructure\Persistence\Entity'
            Accounts:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Accounts/Infrastructure/Persistence\Entity'
                prefix: 'App\Accounts\Infrastructure\Persistence\Entity'
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
