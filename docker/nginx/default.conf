server {
    listen 80;
    server_name _;
    root /var/www/html/public_html;
    index index.php index.html;

    client_max_body_size 64m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # 127.0.0.11 — встроенный DNS Docker; резолвим на лету, а не при старте nginx,
        # чтобы не падать с "host not found in upstream" при цикличных рестартах.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS off;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/zaborprofil_access.log;
    error_log /var/log/nginx/zaborprofil_error.log warn;
}
