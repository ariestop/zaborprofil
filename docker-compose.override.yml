services:
  app:
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=zaborprofil-docker}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
      # Тот же named volume, что у node: иначе app видит ./node_modules с хоста без прав www-data.
      CHOWN_NODE_MODULES: "1"
    volumes:
      - php_cache:/var/www/html/var/cache
      - php_logs:/var/www/html/var/log
      - node_modules:/var/www/html/node_modules

  node:
    environment:
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1000}
    ports:
      - ${VITE_PORT:-5173}:5173
    volumes:
      - node_modules:/var/www/html/node_modules

  mysql:
    ports:
      - ${MYSQL_PORT:-13306}:3306

volumes:
  php_cache:
  php_logs:
  node_modules:
