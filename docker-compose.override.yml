services:
  app:
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=zaborprofil-docker}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
    volumes:
      - php_vendor:/var/www/html/vendor
      - php_cache:/var/www/html/var/cache
      - php_logs:/var/www/html/var/log

  node:
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    ports:
      - ${VITE_PORT:-5173}:5173
    volumes:
      - node_modules:/var/www/html/node_modules

  postgres:
    ports:
      - ${POSTGRES_PORT:-15432}:5432

  redis:
    ports:
      - ${REDIS_PORT:-16379}:6379

volumes:
  php_vendor:
  php_cache:
  php_logs:
  node_modules:
