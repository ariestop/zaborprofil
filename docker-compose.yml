#checkov:skip=CKV_SECRET_6: Local Docker development credentials only.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["/usr/local/bin/docker-app-entrypoint.sh", "php-fpm"]
    user: root
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      MAILER_DSN: ${MAILER_DSN}
      SITE_URL: ${SITE_URL:-http://localhost}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - uploads_data:/var/www/html/public_html/uploads

  nginx:
    image: nginx:1.30.0-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - ${HTTP_PORT:-80}:80
    volumes:
      - ./:/var/www/html:ro
      - uploads_data:/var/www/html/public_html/uploads:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zaborprofil}
      MYSQL_USER: ${MYSQL_USER:-zaborprofil}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zaborprofil}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/zaborprofil.cnf:ro
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - ${MAILPIT_PORT:-8025}:8025

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    ports:
      - ${ADMINER_PORT:-8080}:8080

volumes:
  mysql_data:
  redis_data:
  uploads_data:
