framework:
    router:
        utf8: true

when@prod: &prod_router
    framework:
        router:
            strict_requirements: null

# staging (APP_ENV=staging, dev.zaborprofil.ru) получает ту же конфигурацию, что и prod: стенд проверяет prod-настройки перед выкладкой.
when@staging: *prod_router
