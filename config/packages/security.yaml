security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        admin_user_provider:
            entity:
                class: App\Module\User\Infrastructure\Doctrine\Entity\AdminUser
                property: email

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        ROLE_ADMIN: [ROLE_EDITOR, ROLE_SEO, ROLE_MANAGER]
        ROLE_EDITOR: []
        ROLE_SEO: []
        ROLE_MANAGER: []

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|build)/
            security: false

        main:
            lazy: true
            provider: admin_user_provider
            user_checker: App\Module\Auth\Infrastructure\Security\AdminUserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
                default_target_path: admin_dashboard
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: 15 minutes

    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        firewalls:
            main:
                # Avoid rate-limiting interfering with deterministic functional tests.
                login_throttling: false
