framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: messenger_messages
                # Повторы через 1, 3, 9, 27 и 60 минут (~1 ч 40 мин): переживают сбой SMTP или Telegram.
                # После последней попытки сообщение уходит в failed (messenger:failed:show / :retry).
                retry_strategy:
                    max_retries: 5
                    delay: 60000
                    multiplier: 3
                    max_delay: 3600000
            failed:
                dsn: doctrine://default?queue_name=failed
                options:
                    table_name: messenger_messages

        routing:
            App\Shared\Infrastructure\Logging\Message\SendTelegramLogMessage: async
            App\Module\Lead\Application\Notification\NotifyLeadMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: in-memory://
                failed: in-memory://
