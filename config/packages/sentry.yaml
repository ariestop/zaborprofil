# Error tracking. Пустой SENTRY_DSN = выключено (по умолчанию, в dev/test).
# DSN может указывать на self-hosted Sentry/GlitchTip: персональные данные не отправляются
# (send_default_pii=false + SentryEventScrubber), см. docs/28-logging-observability.md.
sentry:
    dsn: '%env(default::SENTRY_DSN)%'
    register_error_listener: true
    register_error_handler: true
    tracing:
        enabled: false
    options:
        environment: '%kernel.environment%'
        send_default_pii: false
        max_request_body_size: none
        sample_rate: 1.0
        traces_sample_rate: 0.0
        before_send: App\Shared\Infrastructure\Observability\SentryEventScrubber
        ignore_exceptions:
            - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
            - Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException
            - Symfony\Component\Security\Core\Exception\AccessDeniedException
            - Symfony\Component\Security\Core\Exception\AuthenticationException
