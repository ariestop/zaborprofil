framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    session:
        handler_id: null
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_secure: auto
        cookie_samesite: lax

    csrf_protection: true

    php_errors:
        log: true

    rate_limiter:
        admin_client_errors:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
        # Жёсткий потолок приёма заявок с одного IP: сверх него запрос не сохраняется (429).
        # Мягкий порог антиспама (LeadAntiSpamChecker: больше 5 в час — в «Спам») срабатывает раньше.
        public_leads:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

when@test:
    framework:
        test: true
        disallow_search_engine_index: false
        # Кэш-пул rate limiter сбрасывается между запросами (kernel.reset), поэтому в тестах лимиты живут в памяти процесса.
        rate_limiter:
            admin_client_errors:
                storage_service: test.rate_limiter.storage
            public_leads:
                storage_service: test.rate_limiter.storage
        session:
            storage_factory_id: session.storage.factory.mock_file
