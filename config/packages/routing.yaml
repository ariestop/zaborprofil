framework:
    router:
        # Configure how to generate URLs in non-HTTP contexts, such as CLI commands.
        # See https://symfony.com/doc/current/routing.html#generating-urls-in-commands
        default_uri: '%env(DEFAULT_URI)%'

when@prod: &prod_routing
    framework:
        router:
            strict_requirements: null

# staging (APP_ENV=staging, dev.zaborprofil.ru) получает ту же конфигурацию, что и prod: стенд проверяет prod-настройки перед выкладкой.
when@staging: *prod_routing
