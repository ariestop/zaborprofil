doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        driver: pdo_mysql
        server_version: '8.4'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collation: utf8mb4_0900_ai_ci
            engine: InnoDB
        profiling_collect_backtrace: '%kernel.debug%'

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App


when@test:
    doctrine:
        dbal:
            # В test-окружении Messenger работает на in-memory транспортах, поэтому Symfony-listener не
            # добавляет `messenger_messages` в ожидаемую схему, а миграции эту таблицу создают (как и в dev/prod).
            # Исключаем таблицу из сравнения, чтобы `doctrine:schema:validate` в CI не считал её лишней.
            # См. docs/17-doctrine-and-database.md §13.1.
            schema_filter: '~^(?!messenger_messages$)~'

when@prod: &prod_doctrine
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

# staging (APP_ENV=staging, dev.zaborprofil.ru) получает ту же конфигурацию, что и prod: стенд проверяет prod-настройки перед выкладкой.
when@staging: *prod_doctrine
