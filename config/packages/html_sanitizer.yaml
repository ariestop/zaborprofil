framework:
    html_sanitizer:
        sanitizers:
            # HTML блоков rich-text: очищается при сохранении (StructuredRichTextSanitizer) и ещё раз при выводе
            # (`|sanitize_html('app.rich_text_sanitizer')` в шаблонах), чтобы ранее сохранённый HTML тоже был безопасен.
            # Набор тегов совпадает с возможностями редактора (admin/components/tiptap-templates/.../simple-editor.tsx)
            # и превью в админке (admin/shared/lib/sanitize-html.ts); обработчики событий, `javascript:`-ссылки,
            # script/style и прочие атрибуты удаляются. sup/sub — для м², м³ и формул.
            app.rich_text_sanitizer:
                allow_elements:
                    p: ['style']
                    br: []
                    strong: []
                    b: []
                    em: []
                    i: []
                    u: []
                    ul: []
                    ol: []
                    li: []
                    h2: ['style']
                    h3: ['style']
                    h4: ['style']
                    blockquote: []
                    a: ['href', 'title', 'target', 'rel']
                    span: []
                    sup: []
                    sub: []
                # Неразрешённые обёртки убираются, а их текст остаётся (как раньше делал strip_tags).
                block_elements: [div, section, article, h1, h5, h6, mark, s, del, ins, small, code, pre, font]
                allowed_link_schemes: [http, https, mailto, tel]
                allow_relative_links: true
                # По умолчанию вход обрезается до 20 000 байт (~10 000 символов кириллицы) — мало для длинного текста.
                max_input_length: 500000
