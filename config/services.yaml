parameters:
    empty_string: ''
    app.site_url: '%env(SITE_URL)%'
    app.vite.manifest_path: '%kernel.project_dir%/public_html/build/.vite/manifest.json'
    app.vite.public_build_path: /build
    app.release_info_path: '%kernel.project_dir%/var/release-info.json'
    app.media_upload_dir: '%kernel.project_dir%/public_html/uploads/media'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: ../src/
        exclude:
            - ../src/Kernel.php
            - ../src/Module/*/Domain/Entity/
            - ../src/Module/*/Infrastructure/Doctrine/Entity/

    App\Module\Content\Application\Service\PublicPageResolverInterface:
        alias: App\Module\Content\Application\Service\PublicPageResolver

    App\Module\Content\Domain\Repository\PageRepositoryInterface:
        alias: App\Module\Content\Infrastructure\Repository\DoctrinePageRepository

    App\Module\Content\Domain\Repository\PageBlockRepositoryInterface:
        alias: App\Module\Content\Infrastructure\Repository\DoctrinePageBlockRepository

    App\Module\Content\Application\Service\PagePreviewToken:
        arguments:
            $secret: '%kernel.secret%'

    App\Module\Settings\Domain\Repository\SettingRepositoryInterface:
        alias: App\Module\Settings\Infrastructure\Doctrine\Repository\DoctrineSettingRepository

    App\Module\Seo\Domain\Repository\RedirectRepositoryInterface:
        alias: App\Module\Seo\Infrastructure\Doctrine\Repository\DoctrineRedirectRepository

    App\Module\AuditLog\Domain\Repository\AuditLogRepositoryInterface:
        alias: App\Module\AuditLog\Infrastructure\Doctrine\Repository\DoctrineAuditLogRepository

    App\Module\Media\Domain\Repository\MediaAssetRepositoryInterface:
        alias: App\Module\Media\Infrastructure\Doctrine\Repository\DoctrineMediaAssetRepository

    App\Module\Media\UI\Admin\MediaApiController:
        arguments:
            $mediaUploadDir: '%app.media_upload_dir%'

    App\Module\Menu\Domain\Repository\MenuItemRepositoryInterface:
        alias: App\Module\Menu\Infrastructure\Doctrine\Repository\DoctrineMenuItemRepository

    App\Module\Lead\Domain\Repository\LeadRepositoryInterface:
        alias: App\Module\Lead\Infrastructure\Doctrine\Repository\DoctrineLeadRepository

    App\Module\Lead\UI\Web\LeadApiController:
        arguments:
            $leadNotificationEmail: '%env(default:empty_string:LEAD_NOTIFICATION_EMAIL)%'

    App\Shared\UI\Twig\ViteAssetExtension:
        arguments:
            $manifestPath: '%app.vite.manifest_path%'
            $publicBuildPath: '%app.vite.public_build_path%'

    App\Shared\UI\Console\SmokeTestCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Module\Seo\UI\Web\RobotsController:
        arguments:
            $environment: '%kernel.environment%'
            $siteUrl: '%app.site_url%'

    App\Module\Seo\UI\Web\SitemapController:
        arguments:
            $siteUrl: '%app.site_url%'

    App\Module\Seo\Application\Service\CanonicalUrlGuard:
        arguments:
            $siteUrl: '%app.site_url%'

    App\Module\Admin\Infrastructure\Http\AdminApiOriginSubscriber:
        arguments:
            $siteUrl: '%app.site_url%'

    App\Shared\Infrastructure\Http\SecurityHeadersSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    App\Shared\Infrastructure\Logging\Processor\RequestProcessor:
        tags:
            - { name: monolog.processor }

    App\Shared\Infrastructure\Logging\Processor\UserProcessor:
        tags:
            - { name: monolog.processor }

    App\Shared\Infrastructure\Logging\Processor\ReleaseProcessor:
        arguments:
            $environment: '%kernel.environment%'
            $releaseInfoPath: '%app.release_info_path%'
        tags:
            - { name: monolog.processor }

    App\Shared\Infrastructure\Logging\Processor\PiiRedactorProcessor:
        tags:
            - { name: monolog.processor }

    App\Shared\Infrastructure\Health\HealthRegistry:
        arguments:
            $checks: !tagged_iterator app.health_check

when@test:
    parameters:
        app.vite.manifest_path: '%kernel.project_dir%/tests/Fixtures/vite/manifest.json'
