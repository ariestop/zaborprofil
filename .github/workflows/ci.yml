name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - dev
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zaborprofil_test
          MYSQL_USER: zaborprofil_test
          MYSQL_PASSWORD: zaborprofil_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, mbstring, opcache, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer audit
        run: composer audit --no-interaction

      - name: PHP syntax check
        run: composer check:syntax

      - name: PHP-CS-Fixer
        run: composer check:cs

      - name: PHPStan
        run: composer check:phpstan

      - name: Rector dry run
        run: composer check:rector

      - name: Use MySQL for test environment
        run: cp .env.test.ci .env.test.local

      - name: Doctrine migrations status
        run: php bin/console doctrine:migrations:status --env=test --no-interaction

      - name: Run Doctrine migrations on the CI MySQL
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: Doctrine schema validation
        run: php bin/console doctrine:schema:validate --env=test --no-interaction --skip-sync

      - name: Symfony container linter
        run: php bin/console lint:container --env=test --no-interaction

      - name: Twig templates linter
        run: php bin/console lint:twig templates --env=test --no-interaction

      - name: Deploy scripts shell syntax check
        run: |
          set -e
          for script in tools/deploy/*.sh; do
            bash -n "$script"
          done

      - name: Beget deploy script checks
        run: |
          set -e
          shellcheck -x tools/deploy/deploy-beget.sh tests/shell/deploy-beget.sh
          bash tests/shell/deploy-beget.sh

      - name: PHPUnit
        run: composer test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
