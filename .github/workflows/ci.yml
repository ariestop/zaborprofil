name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zaborprofil_test
          POSTGRES_USER: zaborprofil_test
          POSTGRES_PASSWORD: zaborprofil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zaborprofil_test -d zaborprofil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, mbstring, opcache, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer audit
        run: composer audit --no-interaction

      - name: PHP syntax check
        run: composer check:syntax

      - name: PHP-CS-Fixer
        run: composer check:cs

      - name: PHPStan
        run: composer check:phpstan

      - name: Rector dry run
        run: composer check:rector

      - name: Use PostgreSQL for test environment
        run: cp .env.test.ci .env.test.local

      - name: Doctrine migrations status
        run: php bin/console doctrine:migrations:status --env=test --no-interaction

      - name: Run Doctrine migrations on the CI Postgres
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: Doctrine schema validation
        run: php bin/console doctrine:schema:validate --env=test --no-interaction --skip-sync

      - name: Symfony container linter
        run: php bin/console lint:container --env=test --no-interaction

      - name: Twig templates linter
        run: php bin/console lint:twig templates --env=test --no-interaction

      - name: Deploy scripts shell syntax check
        run: |
          set -e
          for script in tools/deploy/*.sh; do
            bash -n "$script"
          done

      - name: PHPUnit
        run: composer test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Frontend lint (admin scope)
        run: npm run lint:admin

      - name: Build frontend
        run: npm run build

      - name: Chunk budgets
        run: npm run check:chunks

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      POSTGRES_USER: zaborprofil_test
      POSTGRES_PASSWORD: zaborprofil_test
      POSTGRES_DB: zaborprofil_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      REDIS_URL: redis://127.0.0.1:6379/1

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zaborprofil_test
          POSTGRES_USER: zaborprofil_test
          POSTGRES_PASSWORD: zaborprofil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zaborprofil_test -d zaborprofil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, mbstring, opcache, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Use PostgreSQL for test environment
        run: cp .env.test.ci .env.test.local

      - name: Generate E2E admin password
        run: echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Run Doctrine migrations for E2E database
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: Seed E2E admin user
        env:
          APP_ENV: test
          APP_DEBUG: 0
          E2E_ADMIN_EMAIL: e2e-admin@example.test
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: |
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?serverVersion=18&charset=utf8"
          php tools/testing/seed-e2e-admin.php

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start app server for E2E smoke
        env:
          APP_ENV: test
          APP_DEBUG: 0
          SITE_URL: http://127.0.0.1:8000
          DEFAULT_URI: http://127.0.0.1:8000
        run: |
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?serverVersion=18&charset=utf8"
          php -S 127.0.0.1:8000 -t public_html >/tmp/e2e-app.log 2>&1 &

      - name: Wait for app server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/admin/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "App server did not start in time."
          cat /tmp/e2e-app.log || true
          exit 1

      - name: Run Playwright smoke suite
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_ADMIN_EMAIL: e2e-admin@example.test
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e:smoke

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-smoke-artifacts
          path: |
            test-results/
            playwright-report/
            /tmp/e2e-app.log
          if-no-files-found: ignore
