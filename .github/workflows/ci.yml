name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zaborprofil_test
          POSTGRES_USER: zaborprofil_test
          POSTGRES_PASSWORD: zaborprofil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zaborprofil_test -d zaborprofil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, mbstring, opcache, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer audit
        run: composer audit --no-interaction

      - name: PHP syntax check
        run: composer check:syntax

      - name: PHP-CS-Fixer
        run: composer check:cs

      - name: PHPStan
        run: composer check:phpstan

      - name: Rector dry run
        run: composer check:rector

      - name: Use PostgreSQL for test environment
        run: cp .env.test.ci .env.test.local

      - name: Doctrine migrations status
        run: php bin/console doctrine:migrations:status --env=test --no-interaction

      - name: Run Doctrine migrations on the CI Postgres
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: Doctrine schema validation
        run: php bin/console doctrine:schema:validate --env=test --no-interaction --skip-sync

      - name: Symfony container linter
        run: php bin/console lint:container --env=test --no-interaction

      - name: Twig templates linter
        run: php bin/console lint:twig templates --env=test --no-interaction

      - name: Deploy scripts shell syntax check
        run: |
          set -e
          for script in tools/deploy/*.sh; do
            bash -n "$script"
          done

      - name: PHPUnit
        run: composer test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
