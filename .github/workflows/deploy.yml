name: Deploy

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_REF: ${{ github.ref_name }}

jobs:
  verify-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require successful CI run for current SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            core.info(`Checking CI workflow runs for SHA ${sha}`);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              },
            );

            const ciRuns = runs.filter(
              (r) => r.name === 'CI' && (r.event === 'push' || r.event === 'workflow_dispatch'),
            );
            if (ciRuns.length === 0) {
              core.setFailed(
                `No CI workflow run found for SHA ${sha}. Deploy is gated on a successful CI run.`,
              );
              return;
            }

            const latest = ciRuns
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .at(0);

            core.info(`Latest CI run: id=${latest.id} status=${latest.status} conclusion=${latest.conclusion} url=${latest.html_url}`);

            if (latest.status !== 'completed' || latest.conclusion !== 'success') {
              core.setFailed(
                `CI run for SHA ${sha} is ${latest.status}/${latest.conclusion}. Deploy refused.`,
              );
              return;
            }

            core.info('CI is green for current SHA. Proceeding with deploy.');

  # The frontend (Vite/Tailwind/React admin) is built once here and the same
  # archive is shipped to staging and production, so the VPS needs no Node.js.
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs:
      - verify-ci
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package frontend build
        run: |
          set -euo pipefail
          test -f public_html/build/.vite/manifest.json
          mkdir dist
          cp -r public_html/build dist/build
          printf '%s\n' "${GITHUB_SHA}" > dist/BUILD_COMMIT
          tar -czf frontend-build.tar.gz -C dist .
          tar -tzf frontend-build.tar.gz | head -n 20

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    needs:
      - verify-ci
      - build-frontend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: tools/deploy/*
          target: /tmp/zaborprofil-deploy
          strip_components: 2

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: frontend-build.tar.gz
          target: /tmp/zaborprofil-deploy

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            trap 'rm -f /tmp/zaborprofil-deploy/frontend-build.tar.gz' EXIT
            chmod +x /tmp/zaborprofil-deploy/*.sh
            BRANCH="${STAGING_BRANCH:-${{ env.DEPLOY_REF }}}" \
            APP_ROOT="${STAGING_APP_ROOT:-/var/www/zaborprofil}" \
            HEALTH_URL="${STAGING_HEALTH_URL:-https://staging.zaborprofil.ru/health}" \
            DEPLOY_COMMIT="${{ github.sha }}" \
            FRONTEND_BUILD_ARCHIVE=/tmp/zaborprofil-deploy/frontend-build.tar.gz \
            /tmp/zaborprofil-deploy/deploy-staging.sh

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    needs:
      - build-frontend
      - deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          source: tools/deploy/*
          target: /tmp/zaborprofil-deploy
          strip_components: 2

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          source: frontend-build.tar.gz
          target: /tmp/zaborprofil-deploy

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            trap 'rm -f /tmp/zaborprofil-deploy/frontend-build.tar.gz' EXIT
            chmod +x /tmp/zaborprofil-deploy/*.sh
            BRANCH="${PRODUCTION_BRANCH:-${{ env.DEPLOY_REF }}}" \
            APP_ROOT="${PRODUCTION_APP_ROOT:-/var/www/zaborprofil}" \
            HEALTH_URL="${PRODUCTION_HEALTH_URL:-https://zaborprofil.ru/health}" \
            CONFIRM_STAGING_DEPLOYED=yes \
            CONFIRM_DEPLOY_SAFETY_CHECKLIST=yes \
            DEPLOY_COMMIT="${{ github.sha }}" \
            FRONTEND_BUILD_ARCHIVE=/tmp/zaborprofil-deploy/frontend-build.tar.gz \
            /tmp/zaborprofil-deploy/deploy-production.sh
